services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cartable}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
      POSTGRES_DB: ${POSTGRES_DB:-cartable}
    ports:
      - "5429:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cartable} -d ${POSTGRES_DB:-cartable}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Stockage objet S3 pour le dev local (bucket privé). MinIO est multi-arch
  # (fonctionne sur Pi ARM64). Console web sur http://localhost:9001.
  minio:
    image: minio/minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # Job one-shot : crée le bucket au démarrage (idempotent), puis s'arrête.
  minio-createbucket:
    image: minio/mc
    depends_on:
      - minio
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-opencartable}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${S3_ACCESS_KEY} $${S3_SECRET_KEY}; do
        echo 'attente de minio...'; sleep 1;
      done;
      mc mb --ignore-existing local/$${S3_BUCKET};
      "

  api:
    build: .
    # Les migrations s'appliquent au démarrage (no-op tant que versions/ est vide)
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    # .env est requis : cp .env.example .env (OIDC_* et POSTGRES_* obligatoires)
    env_file: .env
    environment:
      # En compose, l'hôte Postgres est le service db (prend le pas sur .env/YAML).
      # L'URL complète est assemblée par app/core/config.py (mot de passe encodé).
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-cartable}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
      POSTGRES_DB: ${POSTGRES_DB:-cartable}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      # En conteneur, S3 est joignable sur le réseau compose (minio:9000).
      # CAVEAT : les URL présignées mintées ici pointent donc minio:9000,
      # INJOIGNABLE par le navigateur. Pour tester l'upload de bout en bout,
      # lancer uvicorn en local (config/development.yaml → localhost:9000).
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-opencartable}
      S3_REGION: ${S3_REGION:-us-east-1}
    depends_on:
      db:
        condition: service_healthy
      minio-createbucket:
        condition: service_completed_successfully
    healthcheck:
      # curl absent de python:slim -> healthcheck en python stdlib
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
    # Le reverse proxy nginx (géré par l'infra) se branche sur ce port
    ports:
      - "8000:8000"

  # Maintenance périodique (app/maintenance/) — miroir du service du compose de
  # preprod, mais sous le profil `maintenance` : `docker compose up` ne le
  # démarre PAS. Pour l'exercer en dev :
  #   docker compose --profile maintenance up scheduler
  # (ou, plus simple, `python -m app.maintenance` avec le venv depuis la racine :
  #  une passe complète tout de suite, sans attendre un créneau)
  scheduler:
    build: .
    profiles: ["maintenance"]
    restart: unless-stopped
    # tini en PID 1 : reape les zombies et relaie les signaux. Le process Python
    # installe de toute façon son propre handler SIGTERM — obligatoire, car le
    # noyau ne délivre pas à PID 1 un signal dont le handler est celui par défaut.
    init: true
    # Le scheduler laisse jusqu'à MAINTENANCE_SHUTDOWN_GRACE_SECONDS (20 s) au
    # job en cours de finir et d'écrire son état, puis dispose le pool. Les 10 s
    # par défaut de `docker stop` le tueraient au milieu.
    stop_grace_period: 30s
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-cartable}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
      POSTGRES_DB: ${POSTGRES_DB:-cartable}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-opencartable}
      S3_REGION: ${S3_REGION:-us-east-1}
    depends_on:
      db:
        condition: service_healthy
    # ⚠ Écrase l'ENTRYPOINT de l'image (init_db.py + alembic upgrade head) : les
    # migrations sont le job du seul service api. Chaque job refuse de lui-même
    # de travailler tant que la base n'est pas à la révision Alembic de son image
    # (app/maintenance/schema.py) — c'est ça, et non l'ordre de démarrage, qui
    # garantit qu'on ne purge jamais contre un schéma inattendu.
    # Forme exec, SANS shell : SIGTERM arrive directement sur Python. `command`
    # DOIT être posé, sinon le CMD de l'image (uvicorn …) partirait en arguments.
    entrypoint: ["python"]
    command: ["-m", "app.maintenance.scheduler"]

volumes:
  pgdata:
  miniodata:
