# Compose de déploiement (preprod) — l'image est PULLÉE depuis le registry,
# jamais buildée ici (cf. .gitea/workflows/deploy-preprod.yml).
#
# Postgres et S3 sont EXTERNES à cette stack (cf. config/preprod.yaml :
# POSTGRES_HOST/S3_* pointent l'infra existante, pas des conteneurs locaux) :
# les SECRETS qui les complètent vivent dans le .env déployé à côté de ce
# fichier (mêmes clés que .env.example, plus APP_ENV=preprod — cf. le workflow).
#
# REGISTRY / IMAGE / IMAGE_TAG sont exportés par le workflow de déploiement
# avant `docker compose pull && up` ; ce fichier ne les définit pas.
services:
  # Canal de contrôle backoffice ↔ scheduler (app/maintenance/control.py),
  # partagé par l'api et le scheduler (REDIS_URL de config/preprod.yaml).
  # Éphémère : aucune persistance, aucun port publié. C'est lui — et non
  # Postgres — qui porte les demandes de passe : la base (managée, en veille
  # quand rien ne la sollicite) n'est touchée que par les passes elles-mêmes.
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "32mb"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    image: ${REGISTRY}/${IMAGE}:${IMAGE_TAG}
    restart: unless-stopped
    # Les migrations s'appliquent au démarrage (no-op si déjà à jour).
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    env_file: .env
    healthcheck:
      # curl absent de python:slim -> healthcheck en python stdlib
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
    # Le reverse proxy nginx (géré par l'infra) se branche sur ce port.
    ports:
      - "8100:8000"

  # Maintenance périodique (app/maintenance/) — même image que l'API, hors de
  # son process : le balayage du bucket et l'UPDATE des tours d'outil n'ont rien
  # à faire dans le worker qui sert les requêtes (contrainte Pi).
  # Process RÉSIDENT (~60 Mo) : un AsyncIOScheduler qui dort entre deux crons,
  # là où l'ancienne boucle shell ne gardait que `sh` + `sleep` (~1 Mo). C'est
  # le prix d'une cadence par tâche et d'un état en base.
  scheduler:
    image: ${REGISTRY}/${IMAGE}:${IMAGE_TAG}
    restart: unless-stopped
    # tini en PID 1 : reape les zombies et relaie les signaux. Le process Python
    # installe de toute façon son propre handler SIGTERM — obligatoire, car le
    # noyau ne délivre pas à PID 1 un signal dont le handler est celui par défaut
    # (sans lui, `docker stop` attendrait 10 s puis SIGKILL, à CHAQUE déploiement).
    init: true
    # > MAINTENANCE_SHUTDOWN_GRACE_SECONDS (20 s) : le job en cours a le temps de
    # finir et d'écrire son état avant que le pool ne soit disposé.
    stop_grace_period: 30s
    env_file: .env
    # Confort de démarrage seulement : ça ordonne la PREMIÈRE mise en route.
    # La vraie garantie est ailleurs — CHAQUE job vérifie, juste avant de
    # travailler, que la base est à la révision Alembic de son image
    # (app/maintenance/schema.py) et se met en `skipped` sinon. Cela couvre
    # aussi le reboot du Pi (restart sans réévaluation des dépendances) et les
    # déploiements ultérieurs, pendant lesquels ce conteneur-ci tourne déjà.
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    # ⚠ Écrase l'ENTRYPOINT de l'image (docker-entrypoint.sh = init_db.py +
    # alembic upgrade head) : sans ça, ce conteneur rejouerait les migrations en
    # concurrence avec l'api à chaque démarrage.
    # Forme exec, SANS shell : SIGTERM arrive directement sur Python. `command`
    # DOIT être posé, sinon le CMD de l'image (uvicorn …) partirait en arguments.
    # Aucune passe au démarrage : le boot journalise le plan (cadence et
    # prochaine occurrence de chaque job). Pour une passe immédiate après un
    # déploiement : docker compose exec scheduler python -m app.maintenance
    entrypoint: ["python"]
    command: ["-m", "app.maintenance.scheduler"]
