# Config publique de PREPROD (versionnée dans le repo) — chargée quand le .env
# du serveur porte APP_ENV=preprod (cf. app/core/config.py et
# .gitea/workflows/deploy-preprod.yml).
# Les secrets (POSTGRES_PASSWORD, S3_*, AI_API_KEY, ...) vont dans le .env du
# serveur, jamais ici.
#
# Cible : API sur https://api.preprod.opencartable.com, SPA sur
# https://preprod.opencartable.com.

DEBUG: false

# Front et API sont sur DEUX origines distinctes en preprod
# (preprod.opencartable.com / api.preprod.opencartable.com) : le middleware CORS
# est donc actif et doit lister l'origine EXACTE de la SPA (schéma + hôte, sans
# slash final), en miroir d'`apiUrl` dans
# OpenCartableFront/src/environments/environment.preprod.ts.
CORS_ORIGINS:
  - https://preprod.opencartable.com

# Postgres — EXTERNE à la stack de preprod (cf. docker-compose.preprod.yml :
# aucun service `db`). Le mot de passe vit dans le .env du serveur ; un Postgres
# managé peut aussi être branché d'un bloc via DATABASE_URL dans ce .env.
POSTGRES_USER: open_cartable
POSTGRES_HOST: postgres.mesh.h.fbatard.fr
POSTGRES_PORT: 5432
POSTGRES_DB: open_cartable
# Postgres managé/TLS : décommenter.
# POSTGRES_SSLMODE: require

# Zitadel de preprod. OIDC_AUDIENCE = l'ID de projet Zitadel (2e entrée du
# claim `aud`), qui doit rester cohérent avec le clientId gravé côté front dans
# src/environments/environment.preprod.ts.
OIDC_ISSUER:  https://zitadel.home.fbatard.fr
OIDC_AUDIENCE: "380648758204956674"

# Stockage S3 — MinIO auto-hébergé, bucket privé EXTERNE à la stack. Les clés
# (S3_ACCESS_KEY/S3_SECRET_KEY) vont dans le .env du serveur.
# ⚠ L'endpoint doit être joignable par le NAVIGATEUR, pas seulement par l'API :
# les URL présignées (PUT d'upload, GET de lecture) sont suivies côté client. Sa
# politique CORS doit donc autoriser https://preprod.opencartable.com (PUT/GET,
# en-tête Content-Type).
S3_ENDPOINT_URL: https://minio-s3.home.fbatard.fr
S3_REGION: eu-west-3
S3_BUCKET: opencartable

# Partage public (J2) — durée de vie des liens de partage élèves (jours).
SHARE_LINK_TTL_DAYS: 270

# Client IA (BYO token) — fallback serveur OPTIONNEL quand l'appelant ne
# fournit pas sa propre config. AI_API_KEY est un secret → .env du serveur.
# Laisser commenté = pas de fallback (chaque utilisateur apporte sa clé).
AI_PROVIDER: mistral
AI_MODEL: ministral-14b-latest
AI_BASE_URL: https://api.mistral.ai/v1
# Préférences de raisonnement de l'IA par défaut (absentes = défaut du
# modèle) — mêmes règles par provider que la clé personnelle ; sans objet
# pour mistral (422 si posées).
# AI_REASONING: true
# AI_REASONING_EFFORT: medium
# Quota d'appels au fallback AI_* par utilisateur et par jour (UTC) — priorité
# à users.ai_daily_call_quota s'il est renseigné ; 0 = illimité. Défaut : 30.
# AI_DEFAULT_DAILY_QUOTA: 30

# Langfuse (observabilité LLM, opt-in) — actif ssi les 3 variables sont
# renseignées ; les clés sont des secrets → .env du serveur.
# LANGFUSE_HOST: https://cloud.langfuse.com

# Purge périodique (app/maintenance/, service `purge` du compose de preprod).
# TOUS les délais de purge vivent ici. Rétentions en JOURS, 0 = tâche
# désactivée ; les valeurs ci-dessous sont les DÉFAUTS du code, décommenter pour
# les changer.
# PURGE_INTERVAL_SECONDS: 86400         # cadence (lue une fois au démarrage du conteneur)
# PURGE_AI_USAGE_DAYS: 365              # compteurs de quota (plancher dur : 2 j)
# PURGE_AI_TOOL_CONTENT_DAYS: 180       # allège le contenu des tours tool
# PURGE_AI_CONVERSATIONS_DAYS: 0        # désactivé — travail de prof
# PURGE_EXERCISE_SUBMISSIONS_DAYS: 0    # désactivé — données d'élèves
# PURGE_SHARE_LINKS_DAYS: 365           # liens expirés depuis N jours
# PURGE_PENDING_RESOURCES_DAYS: 30      # uploads jamais confirmés (+ objet S3)
# PURGE_S3_ORPHANS_DAYS: 90             # grâce sur LastModified (sécurité)
# PURGE_S3_ORPHANS_DRY_RUN: true        # à passer à false après relecture des logs
